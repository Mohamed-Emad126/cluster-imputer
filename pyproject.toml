[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-imputer"
version = "0.1.0"
description = "A high-performance cluster-aware missing data imputer for mixed tabular data (Nature Scientific Reports)."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Mahmoud M. Ismail" },
    { name = "Mohamed Emad", email = "mohamed.emad222210@gmail.com" },
    { name = "Mai Mohamed" }
]
keywords = [
    "imputation",
    "missing-values",
    "clustering",
    "xgboost",
    "tabular-data",
    "machine-learning",
    "scikit-learn",
    "data-cleaning",
    "scientific-reports"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "xgboost>=1.5.0",
    "joblib>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Mohamed-Emad126/cluster-imputer"
Repository = "https://github.com/Mohamed-Emad126/cluster-imputer"
Issues = "https://github.com/Mohamed-Emad126/cluster-imputer/issues"
"Scientific Reports Paper" = "https://doi.org/10.1038/s41598-026-70170-9"

[tool.setuptools.packages.find]
where = ["."]
include = ["cluster_imputer*"]

[tool.setuptools.package-data]
cluster_imputer = ["py.typed"]
